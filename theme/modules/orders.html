<div class="ord-container">
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm p-3 ord-widget">
                <div class="d-flex align-items-center">
                    <div class="ord-icon-box bg-primary-subtle text-primary me-3">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block">Tổng đơn hàng</small>
                        <span class="fw-bold fs-5">1,250</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm p-3 ord-widget">
                <div class="d-flex align-items-center">
                    <div class="ord-icon-box bg-warning-subtle text-warning me-3">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block">Chờ duyệt</small>
                        <span class="fw-bold fs-5">12</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm p-3 ord-widget">
                <div class="d-flex align-items-center">
                    <div class="ord-icon-box bg-success-subtle text-success me-3">
                        <i class="fas fa-check-double"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block">Hoàn tất</small>
                        <span class="fw-bold fs-5">1,180</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm p-3 ord-widget">
                <div class="d-flex align-items-center">
                    <div class="ord-icon-box bg-danger-subtle text-danger me-3">
                        <i class="fas fa-ban"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block">Đã hủy</small>
                        <span class="fw-bold fs-5">58</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card ord-card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <input type="text" class="form-control border-0 bg-light shadow-none"
                        placeholder="Tìm mã đơn, tên khách...">
                </div>
                <div class="col-md-3 ms-auto">
                    <select class="form-select border-0 bg-light shadow-none">
                        <option value="">Tất cả trạng thái</option>
                        <option value="pending">Chờ duyệt</option>
                        <option value="shipping">Đang giao</option>
                        <option value="done">Đã giao</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div id="ord-content-render"></div>
        </div>
        <div class="card-footer bg-white py-3 border-0 d-flex justify-content-between align-items-center">
            <div class="small text-muted">Hiển thị <span class="fw-bold">10</span> đơn hàng</div>
            <nav id="ord-pagination"></nav>
        </div>
    </div>
</div>
