<div class="ana-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-dark mb-1">Báo Cáo & Thống Kê</h4>
            <p class="text-muted small mb-0">Dữ liệu kinh doanh chi tiết năm 2026</p>
        </div>
        <div class="ana-filter-actions">
            <input type="month"
                class="form-control form-control-sm shadow-none border-light-subtle d-inline-block w-auto me-2"
                value="2026-05">
            <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                <i class="fas fa-download me-1"></i> Xuất báo cáo
            </button>
        </div>
    </div>

    <!-- Hàng thẻ thống kê nhanh -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3">
                <small class="text-muted d-block mb-1">Tổng doanh thu</small>
                <h4 class="fw-bold text-primary mb-0">3.2B</h4>
                <small class="text-success fw-bold"><i class="fas fa-arrow-up"></i> 15%</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3">
                <small class="text-muted d-block mb-1">Tổng đơn hàng</small>
                <h4 class="fw-bold text-dark mb-0">1,250</h4>
                <small class="text-success fw-bold"><i class="fas fa-arrow-up"></i> 8%</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3">
                <small class="text-muted d-block mb-1">Khách hàng mới</small>
                <h4 class="fw-bold text-dark mb-0">+450</h4>
                <small class="text-danger fw-bold"><i class="fas fa-arrow-down"></i> 2%</small>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3">
                <small class="text-muted d-block mb-1">Tỷ lệ hoàn hàng</small>
                <h4 class="fw-bold text-dark mb-0">1.2%</h4>
                <small class="text-success fw-bold">Ổn định</small>
            </div>
        </div>
    </div>

    <!-- Hàng biểu đồ -->
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3 border-0">
                    <h6 class="fw-bold mb-0">Biến động Doanh thu & Lợi nhuận</h6>
                </div>
                <div class="card-body">
                    <div id="ana-revenue-chart" style="min-height: 350px;"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white py-3 border-0">
                    <h6 class="fw-bold mb-0">Doanh thu theo Danh mục</h6>
                </div>
                <div class="card-body">
                    <div id="ana-category-chart" style="min-height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
