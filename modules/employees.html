<div class="emp-container">
    <div class="emp-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="emp-title">Đội Ngũ Nhân Viên</h3>
            <p class="emp-subtitle text-muted mb-0">Quản lý nhân sự và phân quyền hệ thống</p>
        </div>
        <div class="emp-actions">
            <button class="btn btn-outline-secondary emp-btn-export me-2">
                <i class="fas fa-file-download me-1"></i> Xuất danh sách
            </button>
            <button class="btn btn-primary emp-btn-add" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasAddEmployee">
                <i class="fas fa-plus me-1"></i> Thêm nhân viên
            </button>
        </div>
    </div>

    <div class="card emp-card border-0 shadow-sm">
        <div class="card-header bg-white py-3">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-light"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" class="form-control border-0 bg-light shadow-none"
                            placeholder="Tìm tên, mã NV, phòng ban...">
                    </div>
                </div>
            </div>
        </div>

        <div class="card-body p-0">
            <div id="emp-content-render">
            </div>
        </div>

        <div class="card-footer bg-white py-3 border-0">
            <div class="d-flex justify-content-between align-items-center">
                <div class="small text-muted">Đang hiển thị <span class="fw-bold">5</span> nhân sự</div>
                <nav id="emp-pagination"></nav>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="emp-detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark">Hồ sơ & Phân quyền</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
            
                <div class="modal-body pt-2">
                    <!-- THANH TAB ĐIỀU HƯỚNG -->
                    <ul class="nav nav-pills nav-fill mb-4 bg-light p-1 rounded-pill" id="empModalTab" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active rounded-pill fw-bold small py-2" data-bs-toggle="tab"
                                data-bs-target="#tab-info">
                                <i class="fas fa-id-card me-1"></i> Hồ sơ
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link rounded-pill fw-bold small py-2" data-bs-toggle="tab"
                                data-bs-target="#tab-permission">
                                <i class="fas fa-user-shield me-1"></i> Quyền hạn
                            </button>
                        </li>
                    </ul>
            
                    <div class="tab-content">
                        <!-- TAB 1: THÔNG TIN HỒ SƠ -->
                        <div class="tab-pane fade show active" id="tab-info">
                            <div id="emp-modal-body">
                                <!-- JS sẽ nạp hồ sơ vào đây -->
                            </div>
                        </div>
            
                        <!-- TAB 2: DANH SÁCH PHÂN QUYỀN -->
                        <div class="tab-pane fade" id="tab-permission">
                            <div class="table-responsive" style="max-height: 350px;">
                                <table class="table table-sm table-borderless align-middle">
                                    <tbody id="emp-modal-permission-list">
                                        <!-- JS sẽ nạp switch quyền vào đây -->
                                    </tbody>
                                </table>
                            </div>
                            <div class="d-grid mt-3 pt-3 border-top">
                                <button class="btn btn-primary rounded-pill fw-bold" onclick="savePermissionsFromModal()">
                                    <i class="fas fa-save me-2"></i> Lưu thay đổi quyền
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Offcanvas Thêm nhân viên -->
<div class="offcanvas offcanvas-end border-0 shadow" tabindex="-1" id="offcanvasAddEmployee" style="width: 450px;">
    <div class="offcanvas-header border-bottom py-3">
        <h5 class="offcanvas-title fw-bold"><i class="fas fa-user-tie text-primary me-2"></i>Thêm nhân sự mới</h5>
        <button type="button" class="btn-close shadow-none" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body p-4">
        <form id="form-add-employee" class="row g-3 needs-validation" novalidate>
            <!-- Chọn ảnh đại diện -->
            <div class="col-12 text-center mb-4">
                <div class="position-relative d-inline-block">
                    <img id="emp-avatar-preview"
                        src="https://ui-avatars.com/api/?name=Employee&background=f1f5f9&color=64748b&size=100"
                        class="rounded-circle border p-1" width="100">
                    <label for="emp-upload-avatar"
                        class="btn btn-sm btn-primary rounded-circle position-absolute bottom-0 end-0 p-1"
                        style="width: 30px; height: 30px; cursor: pointer;">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="emp-upload-avatar" hidden>
                    </label>
                </div>
            </div>

            <div class="col-md-12">
                <label class="form-label small fw-bold text-muted">Họ và Tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control border-light-subtle shadow-none"
                    placeholder="Ví dụ: Trần Anh Tuấn" required>
                <div class="invalid-feedback small">Vui lòng nhập họ tên nhân viên.</div>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Mã nhân viên <span
                        class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="text" id="emp-code" class="form-control border-light-subtle shadow-none"
                        placeholder="NV005" required>
                    <button class="btn btn-outline-primary shadow-none" type="button" id="btn-gen-code"
                        title="Tạo mã ngẫu nhiên">
                        <i class="fas fa-magic"></i>
                    </button>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Số điện thoại <span
                        class="text-danger">*</span></label>
                <input type="text" id="emp-phone" class="form-control border-light-subtle shadow-none"
                    placeholder="09xxx" required>
            </div>

            <div class="col-md-12">
                <label class="form-label small fw-bold text-muted">Email công ty <span
                        class="text-danger">*</span></label>
                <input type="email" id="emp-email" class="form-control border-light-subtle shadow-none"
                    placeholder="tuan.ta@company.com" required>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Phòng ban</label>
                <select class="form-select border-light-subtle shadow-none">
                    <option value="IT">Kỹ thuật (IT)</option>
                    <option value="HR">Nhân sự</option>
                    <option value="Kinh doanh">Kinh doanh</option>
                    <option value="Kế toán">Kế toán</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label small fw-bold text-muted">Chức vụ</label>
                <select class="form-select border-light-subtle shadow-none">
                    <option value="Nhân viên">Nhân viên</option>
                    <option value="Chuyên viên">Chuyên viên</option>
                    <option value="Trưởng nhóm">Trưởng nhóm</option>
                    <option value="Quản lý">Quản lý</option>
                </select>
            </div>

            <div class="col-md-12">
                <label class="form-label small fw-bold text-muted">Mật khẩu đăng nhập <span
                        class="text-danger">*</span></label>
                <div class="input-group">
                    <input type="text" id="emp-pass" class="form-control border-light-subtle shadow-none"
                        placeholder="••••••••" required>
                    <button class="btn btn-outline-primary shadow-none" type="button" id="btn-gen-pass"
                        title="Tạo mật khẩu">
                        <i class="fas fa-key"></i>
                    </button>
                    <!-- Nút ẩn/hiện pass hiện tại của em -->
                    <span class="input-group-text bg-light border-light-subtle" style="cursor: pointer;"
                        id="btn-toggle-pass">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <small class="text-muted" style="font-size: 11px;">Mật khẩu nên có cả chữ và số để bảo mật.</small>
            </div>

            <div class="col-12 mt-5 d-grid gap-2">
                <button type="submit" class="btn btn-primary rounded-pill py-2 fw-bold shadow-sm">
                    <i class="fas fa-user-check me-2"></i>Xác nhận thêm nhân sự
                </button>
                <button type="button" class="btn btn-outline-secondary rounded-pill py-2"
                    data-bs-dismiss="offcanvas">Hủy bỏ</button>
            </div>
        </form>
    </div>
</div>
