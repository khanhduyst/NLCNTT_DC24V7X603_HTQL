<!-- Dùng bản FULL để có đủ tính năng căn lề, bảng, font chữ mà không bị lỗi plugin -->
<script src="https://cdn.ckeditor.com/4.22.1/full/ckeditor.js"></script>

<div class="set-container">
    <!-- Giữ nguyên phần nội dung card và modal như cũ -->
    <h4 class="fw-bold py-3 mb-4"><span class="text-muted fw-light">Cấu hình /</span> Cài đặt hệ thống</h4>
    
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white border-bottom py-3 d-flex align-items-center">
            <i class="fas fa-cogs text-primary me-2"></i>
            <h5 class="card-title mb-0 fw-bold">Thông tin doanh nghiệp</h5>
        </div>
        <div class="card-body pt-4">
            <div class="row">
                <div class="mb-3 col-md-6">
                    <label class="form-label text-muted small fw-bold">Tên thương hiệu</label>
                    <input class="form-control border-light-subtle shadow-none" type="text" id="sys-name" value="CÔNG TY FAR GROUP">
                </div>
                <div class="mb-3 col-md-6">
                    <label class="form-label text-muted small fw-bold">Địa chỉ</label>
                    <input type="text" class="form-control border-light-subtle shadow-none" id="sys-address" value="Số 10, Sóc Trăng, Việt Nam">
                </div>
            </div>
            <div class="mt-2">
                <button class="btn btn-primary btn-sm rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalPrintEditor">
                    <i class="fas fa-magic me-2"></i>Thiết kế mẫu in hóa đơn chuyên nghiệp
                </button>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPrintEditor" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold">Trình soạn thảo mẫu in</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="p-2 bg-warning-subtle small text-center">
                        Sử dụng: {Ten_Cong_Ty}, {Dia_Chi}, {Ten_Khach_Hang}, {Tong_Tien}
                    </div>
                    <textarea name="print_editor" id="print_editor_input"></textarea>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" id="save-print-template">Lưu mẫu in</button>
                </div>
            </div>
        </div>
    </div>
</div>
